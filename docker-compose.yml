version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# SOC Microservices Platform — Docker Compose (3-Member Team Setup)
#
# Architecture Breakdown:
#   Student 1 (Gateway & Auth Lead):
#     - api-gateway       (Spring Boot, port 8080)
#     - auth-service      (Spring Boot, port 8081)
#     - client-app        (React Frontend, port 5173)
#
#   Student 2 (Product Service Lead):
#     - product-service   (Spring Boot, port 8082, located in ./other-members-services/product-service)
#
#   Student 3 (Order Service Lead):
#     - order-service     (Spring Boot, port 8083, located in ./other-members-services/order-service)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Student 1: Auth Service ────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - soc-network
    restart: unless-stopped

  # ─── Student 2: Product Service ─────────────────────────────────────────────
  product-service:
    build:
      context: ./other-members-services/product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - soc-network
    restart: unless-stopped

  # ─── Student 3: Order Service ───────────────────────────────────────────────
  order-service:
    build:
      context: ./other-members-services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - PRODUCT_SERVICE_API_KEY=product-service-api-key-secret
    networks:
      - soc-network
    depends_on:
      - product-service
    restart: unless-stopped

  # ─── Student 1: API Gateway ─────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_SERVICE_URL=http://auth-service:8081
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
    networks:
      - soc-network
    depends_on:
      - auth-service
      - product-service
      - order-service
    restart: unless-stopped

  # ─── Unified Client App ─────────────────────────────────────────────────────
  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: client-app
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    networks:
      - soc-network
    depends_on:
      - api-gateway
    restart: unless-stopped

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  soc-network:
    driver: bridge
    name: soc-network
