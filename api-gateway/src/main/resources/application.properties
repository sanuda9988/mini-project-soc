server.port=8080
spring.application.name=api-gateway

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Downstream Microservices URLs (default local, overridable by Docker env)
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8083}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

# API Keys to inject for downstream authorization
product.service.api.key=product-service-api-key-secret
order.service.api.key=order-service-api-key-secret
payment.service.api.key=payment-service-api-key-secret
notification.service.api.key=notification-service-api-key-secret

# Gateway Rate Limiting Configuration
gateway.rate.limit.capacity=10
gateway.rate.limit.refill.rate=2
