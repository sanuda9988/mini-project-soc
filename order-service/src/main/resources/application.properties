server.port=8083
spring.application.name=order-service

# Database Config
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console Configuration (visible at http://localhost:8083/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# API Key Config
api.key=order-service-api-key-secret

# Downstream Microservices Integrations (default local, overridable by Docker env)
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
product.service.api.key=${PRODUCT_SERVICE_API_KEY:product-service-api-key-secret}

payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
payment.service.api.key=${PAYMENT_SERVICE_API_KEY:payment-service-api-key-secret}

notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
notification.service.api.key=${NOTIFICATION_SERVICE_API_KEY:notification-service-api-key-secret}
